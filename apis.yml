aid: data-gov-gr
name: Greece National Data Portal
description: >-
  Greece National Data Portal is a open data portal open-data portal for gr running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 21,931 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
