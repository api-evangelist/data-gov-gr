apis:
  - aid: data-gov-gr:catalog
    name: Greece National Data Portal CKAN Action API
    description: >-
      CKAN Action API for Greece National Data Portal, a consistent JSON-over-HTTP interface over a catalog of 21,931 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://data.gov.gr/api/3/action/.
    humanURL: https://data.gov.gr
    baseURL: https://data.gov.gr/api/3/action
